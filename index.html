<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palette — generador de paletas armónicas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div id="panel-backdrop" class="panel-backdrop" hidden></div>

    <div class="main">
      <header class="topbar">
        <button type="button" id="panel-toggle" class="hamburger" data-i18n-title="tooltips.hamburger" title="Abrir las paletas guardadas" aria-label="Abrir las paletas guardadas" aria-expanded="false" aria-controls="saved-panel">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="wordmark">ColorFLY Studio</span>

        <div class="controls">
          <label class="field">
            <span class="field-label" data-i18n="fields.harmony">Armonía</span>
            <select id="harmony">
              <option value="complementary" data-i18n="harmonies.complementary">Complementaria</option>
              <option value="analogous" data-i18n="harmonies.analogous">Análoga</option>
              <option value="triad" data-i18n="harmonies.triad">Tríada</option>
              <option value="splitComplementary" data-i18n="harmonies.splitComplementary">Complementaria dividida</option>
              <option value="square" data-i18n="harmonies.square">Cuadrada</option>
            </select>
          </label>

          <div class="field">
            <span class="field-label" data-i18n="fields.colors">Colores</span>
            <div class="button-group" role="group" aria-label="Número de colores">
              <button type="button" data-size="6" title="Generar 6 colores">6</button>
              <button type="button" data-size="8" title="Generar 8 colores">8</button>
              <button type="button" data-size="9" title="Generar 9 colores">9</button>
            </div>
          </div>

          <div class="field">
            <span class="field-label" data-i18n="fields.format">Formato</span>
            <div class="button-group" role="group" aria-label="Formato de los códigos">
              <button type="button" data-format="hex" data-i18n-title="tooltips.formatHex" title="Mostrar los códigos en HEX">HEX</button>
              <button type="button" data-format="hsl" data-i18n-title="tooltips.formatHsl" title="Mostrar los códigos en HSL">HSL</button>
            </div>
          </div>

          <label class="field">
            <span class="field-label" data-i18n="fields.language">Idioma</span>
            <select id="language">
              <option value="es">Español</option>
              <option value="en">English</option>
              <option value="fr">Français</option>
            </select>
          </label>

          <button type="button" id="generate" class="primary" data-i18n="buttons.generate" data-i18n-title="tooltips.generate" title="Genera una nueva paleta (los colores bloqueados se conservan)">Generar paleta</button>
        </div>
      </header>

      <main id="palette" class="palette" aria-label="Paleta de colores generada"></main>

      <footer class="toolbar">
        <div class="export-group">
          <button type="button" id="save-palette" data-i18n="buttons.save" data-i18n-title="tooltips.save" title="Guarda esta paleta en tu biblioteca para usarla más tarde">Guardar paleta</button>
          <button type="button" id="export-png" data-i18n="buttons.exportPng">Exportar como imagen</button>
        </div>
        <span id="save-status" class="save-status" aria-live="polite"></span>
      </footer>

      <footer class="site-footer">
        <span>&copy; <span id="copyright-year">2026</span> José Miguel Reyes Betancourt — <span data-i18n="footer.rights">Todos los derechos reservados</span></span>
      </footer>
    </div>

    <aside id="saved-panel" class="saved-panel">
      <div class="saved-panel-header">
        <span class="saved-panel-title" data-i18n="panel.title">Paletas guardadas</span>
        <button type="button" id="panel-close" class="panel-close" data-i18n-title="panel.close" title="Cerrar" aria-label="Cerrar">&times;</button>
      </div>
      <div id="saved-list" class="saved-list"></div>
    </aside>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
